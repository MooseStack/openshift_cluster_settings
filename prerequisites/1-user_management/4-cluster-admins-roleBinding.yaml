kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cluster-admins-rolebinding
subjects:
  # give the "cluster-admins" group cluster-admin permissions to manage the cluster
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: cluster-admins
  # give argocd cluster-admin permissions to manage the cluster
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
