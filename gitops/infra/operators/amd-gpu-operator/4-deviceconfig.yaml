# Used to build and install the AMD GPU driver
# Utilizes the internal image registry, Kernel Module Management(KMM) operator, and Node Feature Discovery Operator(NFD)

apiVersion: amd.com/v1alpha1
kind: DeviceConfig
metadata:
  name: amd-gpu-deviceconfig
  namespace: openshift-amd-gpu
  annotations:
    argocd.argoproj.io/sync-wave: "6" # Run after gitops/infra/operators/kernel-module-management/4-amdgpu-machineconfig.yaml
spec:
  driver:
    enable: true
    image: image-registry.openshift-image-registry.svc:5000/$MOD_NAMESPACE/amdgpu_kmod
    # NOTE: Starting from ROCm 7.1 the amdgpu version is using new versioning schema
    # please refer to https://rocm.docs.amd.com/projects/install-on-linux/en/latest/reference/user-kernel-space-compat-matrix.html
    version: 30.20.1
  selector:
    "feature.node.kubernetes.io/amd-gpu": "true"