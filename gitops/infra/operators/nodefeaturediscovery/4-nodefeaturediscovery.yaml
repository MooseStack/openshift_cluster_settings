# NFD custom resource to detect AMD GPU hardware
apiVersion: nfd.openshift.io/v1
kind: NodeFeatureDiscovery
metadata:
  name: amd-gpu-operator-nfd-instance
  namespace: openshift-nfd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  operand:
    image: quay.io/openshift/origin-node-feature-discovery:latest
    imagePullPolicy: IfNotPresent
    servicePort: 12000
  workerConfig:
    configData: |
      core:
        sleepInterval: 60s
      sources:
        pci:
          deviceClassWhitelist:
            - "0200"
            - "03"
            - "12"
          deviceLabelFields:
            - "vendor"
            - "device"
        custom:
        - name: amd-gpu
          labels:
            feature.node.kubernetes.io/amd-gpu: "true"
          matchAny:
            - matchFeatures:
                - feature: pci.device
                  matchExpressions:
                    vendor: {op: In, value: ["1002"]}
                    device: {op: In, value: [
                      "75a3", # MI355X
                      "75a0", # MI350X
                      "74a5", # MI325X
                      "74a2", # MI308X
                      "74a8", # MI308X-HF
                      "74a0", # MI300A
                      "74a1", # MI300X
                      "74a9", # MI300X-HF
                      "740f", # MI210
                      "7408", # MI250X
                      "740c", # MI250/MI250X
                      "738c", # MI100
                      "738e"  # MI100
                    ]}
          # check for vGPU devices as well, which have different device IDs but the same vendor ID
        - name: amd-vgpu
          labels:
            feature.node.kubernetes.io/amd-vgpu: "true"
          matchAny:
            - matchFeatures:
                - feature: pci.device
                  matchExpressions:
                    vendor: {op: In, value: ["1002"]}
                    device: {op: In, value: [
                      "75b3", # MI355X VF
                      "75b0", # MI350X VF
                      "74b9", # MI325X VF
                      "74b6", # MI308X VF
                      "74bc", # MI308X-HF VF
                      "74b5", # MI300X VF
                      "74bd", # MI300X-HF VF
                      "7410"  # MI210 VF
                    ]}